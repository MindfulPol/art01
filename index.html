<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiet Geometry</title>
    <meta
      name="description"
      content="An atmospheric website about mindfulness, mathematics, stillness, and luminous form."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23070707'/%3E%3Cpath d='M50 12 58 42 88 50 58 58 50 88 42 58 12 50 42 42Z' fill='%23f2c17b'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-scene="origin">
    <canvas class="lightfield" aria-hidden="true"></canvas>
    <div class="noise" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <main class="page">
      <section class="panel panel-hero" data-scene="origin">
        <div class="copy">
          <h1>
            Slow down.
            <span>See the math.</span>
            Stay here.
          </h1>
          <div class="mantra">
            <p>Breath is rhythm.</p>
            <p>Geometry is calm.</p>
          </div>
        </div>

        <div class="stage stage-origin" aria-hidden="true">
          <canvas class="webgl-sculpture"></canvas>
          <div class="stage-glow"></div>
          <div class="stage-rune rune-a"></div>
          <div class="stage-rune rune-b"></div>
          <div class="horizon"></div>
        </div>
      </section>

      <section class="panel panel-axis" data-scene="axis">
        <div class="copy narrow">
          <h2>Silence has shape.</h2>
        </div>

        <div class="axis-words" aria-hidden="true">
          <p>Count</p>
          <p>Curve</p>
          <p>Peace</p>
        </div>

        <div class="stage stage-axis" aria-hidden="true">
          <div class="axis-column axis-column-a"></div>
          <div class="axis-column axis-column-b"></div>
          <div class="axis-orbit"></div>
          <div class="axis-orbit axis-orbit-b"></div>
          <div class="axis-star"></div>
        </div>
      </section>

      <section class="panel panel-signal" data-scene="signal">
        <div class="closing">
          <h2>
            Less noise.
            <span>More presence.</span>
          </h2>
        </div>

        <div class="signal-mark" aria-hidden="true"></div>
        <div class="closing-band">
          <p>Still</p>
          <p>Luminous</p>
          <p>Geometric</p>
          <p>Alive</p>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
